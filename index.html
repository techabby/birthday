<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Happy Birthday My Love ꨄ︎</title>
        <link type="image/png" sizes="96x96" rel="icon"
            href="./assets/icons8-favorite-96.png">
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/responsive.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Poppins:wght@300;400&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <div class="light-flash"></div>

        <!-- Stars -->
        <div class="stars"></div>

        <!-- Dust -->
        <div class="dust"></div>

        <!-- Main Content -->
        <main class="container">
            <!-- Shooting Star -->
            <div class="shooting-star"></div>
            <!-- Moon Glow -->
            <div class="moon-glow"></div>

            <button id="lightBtn">
                Turn On The Lights
            </button>
        </main>

        <!-- ================= PARTY ================= -->

        <div class="party">

            <!-- Fairy Lights -->

            <div class="fairy-lights">

                <div class="wire"></div>

                <div class="bulb" style="left:8%"></div>
                <div class="bulb" style="left:18%"></div>
                <div class="bulb" style="left:28%"></div>
                <div class="bulb" style="left:38%"></div>
                <div class="bulb" style="left:50%"></div>
                <div class="bulb" style="left:62%"></div>
                <div class="bulb" style="left:74%"></div>
                <div class="bulb" style="left:86%"></div>

            </div>
            <!-- Moon Glow -->
            <div class="moon-glow"></div>

            <!-- Balloons -->
            <div class="floating-balloons"></div>

            <!-- Sprinkles -->
            <div class="sprinkle-rain"></div>

            <!-- Shooting Star -->
            <div class="shooting-star"></div>

            <!-- Happy Birthday -->
            <div class="birthday-wall">
                <h1 class="birthday-title" id="birthdayText"></h1>
            </div>

            <!-- Speaker -->
            <div class="speaker" id="speaker">

                <div class="speaker-strap"></div>

                <button id="musicBtn">
                    <i class="fa-solid fa-play"></i>
                </button>

                <div class="speaker-grill">

                    <div class="ring"></div>

                </div>

                <div class="speaker-led"></div>

            </div>

            <audio id="bgMusic" loop>
                <source src="./assets/music/Ed Sheeran - Perfect.mp3"
                    type="audio/mpeg">
            </audio>

            <!-- Cake -->
            <div class="cake-container">

                <div class="cake-shadow"></div>

                <div class="cake">

                    <!-- Sparkles -->
                    <div class="cake-sparkles"></div>

                    <!-- Candles -->
                    <div class="candles">

                        <div class="candle two">

                            <div class="flame"></div>

                            <div class="wick"></div>

                            <span>2</span>

                        </div>

                        <div class="candle zero">

                            <div class="flame"></div>

                            <div class="wick"></div>

                            <span>0</span>

                        </div>

                    </div>

                    <!-- Top Layer -->
                    <div class="layer top">

                        <div class="sprinkles">

                            <span class="sp s1"></span>
                            <span class="sp s2"></span>
                            <span class="sp s3"></span>
                            <span class="sp s4"></span>
                            <span class="sp s5"></span>
                            <span class="sp s6"></span>
                            <span class="sp s7"></span>
                            <span class="sp s8"></span>
                            <span class="sp s9"></span>
                            <span class="sp s10"></span>

                        </div>

                    </div>

                    <!-- Middle Layer -->
                    <div class="layer middle">
                        <div class="sprinkles">

                            <span class="sp s1"></span>
                            <span class="sp s2"></span>
                            <span class="sp s3"></span>
                            <span class="sp s4"></span>
                            <span class="sp s5"></span>
                            <span class="sp s6"></span>
                            <span class="sp s7"></span>
                            <span class="sp s8"></span>
                            <span class="sp s9"></span>
                            <span class="sp s10"></span>
                            <span class="sp s11"></span>
                            <span class="sp s12"></span>
                            <span class="sp s13"></span>
                            <span class="sp s14"></span>
                            <span class="sp s15"></span>
                            <span class="sp s16"></span>

                        </div>

                    </div>

                    <!-- Bottom Layer -->
                    <div class="layer bottom">
                        <div class="pearls">

                            <span class="pearl p1"></span>
                            <span class="pearl p2"></span>
                            <span class="pearl p3"></span>
                            <span class="pearl p4"></span>

                        </div>

                        <div class="ribbon">

                            <div class="ribbon-band"></div>

                            <div class="bow">

                                <div class="loop left"></div>
                                <div class="knot"></div>
                                <div class="loop right"></div>

                                <div class="tail left"></div>
                                <div class="tail right"></div>

                            </div>

                        </div>

                    </div>
                    <div class="stool">

                        <div class="stool-top"></div>

                        <div class="leg l1"></div>
                        <div class="leg l2"></div>
                        <div class="leg l3"></div>
                        <div class="leg l4"></div>

                        <div class="stool-shadow"></div>

                    </div>
                </div>

                <button class="cake-btn blow-btn">

                    Blow The Candles

                </button>

                <div class="wish-message">

                    <h2>✨ Close your eyes and make a wish ✨</h2>

                </div>
            </div>

            <div class="gift-container">

                <div class="gift-box">
                    <div class="lid"></div>
                    <div class="box"></div>
                    <div class="ribbon-v"></div>
                    <div class="ribbon-h"></div>
                    <div class="bow"></div>
                </div>

            </div>
        </div>

    </body>
    <script src="./script/script.js"></script>
</html>
